services:
  db:
    image: postgres:16-alpine
    container_name: tlp4_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tlp4}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tlp4}
      POSTGRES_DB: ${DB_NAME:-tp_integrador}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tlp4} -d ${DB_NAME:-tp_integrador}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tlp4_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tlp4}
      DB_PASSWORD: ${DB_PASSWORD:-tlp4}
      DB_NAME: ${DB_NAME:-tp_integrador}
      JWT_SECRET: ${JWT_SECRET:-tlp4-secret-key-change-in-prod}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tlp4_frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
